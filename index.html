<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NextApple — Колесо Удачи</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#0a0a0f;--card:#13131a;--border:#2a2a3a;--accent:#7c5cfc;--accent2:#fc5c7d;--gold:#ffd700;--text:#fff;--dim:#888899;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;padding-bottom:40px;}
.header{width:100%;padding:20px 16px 10px;text-align:center;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;}
.logo-text{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;}
.sub{font-size:12px;color:var(--dim);}
.section{width:100%;max-width:380px;padding:0 16px;margin-bottom:14px;}
.slabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center;}
.abox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;}
.anum{font-family:'Unbounded',sans-serif;font-size:38px;font-weight:900;color:var(--accent);min-width:52px;text-align:center;transition:color .3s,transform .2s;}
.abtns{display:flex;flex-direction:column;gap:5px;flex:1;}
.abtn{background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.25);border-radius:8px;padding:7px 10px;font-size:11px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:'Inter',sans-serif;-webkit-appearance:none;transition:background .15s;}
.abtn:active{background:rgba(124,92,252,.25);}
.badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.wheel-wrap{position:relative;width:300px;height:300px;margin:0 auto 14px;}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 0 6px rgba(255,215,0,.7));z-index:10;}
#wheel{border-radius:50%;box-shadow:0 0 30px rgba(124,92,252,.35);display:block;}
.spin-btn{display:block;width:200px;margin:0 auto 18px;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:50px;color:#fff;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 20px rgba(124,92,252,.4);-webkit-appearance:none;transition:transform .1s,opacity .2s;}
.spin-btn:active{transform:scale(.95);}
.spin-btn:disabled{opacity:.35;transform:none;cursor:not-allowed;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.overlay.show{display:flex;}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px 24px;max-width:300px;width:88%;text-align:center;animation:pop .4s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:201;}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.remoji{font-size:60px;display:block;margin-bottom:10px;}
.rtitle{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;margin-bottom:8px;}
.rtitle.jackpot{color:var(--gold);}
.rtitle.win{color:var(--accent);}
.rdesc{font-size:14px;color:var(--dim);margin-bottom:22px;line-height:1.5;}
.rbtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.rbtn:active{opacity:.85;}
.cwrap{position:fixed;inset:0;pointer-events:none;z-index:199;overflow:hidden;}
.cp{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(600deg);opacity:0;}}
.hlist{display:flex;flex-direction:column;gap:8px;}
.hitem{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.hemoji{font-size:22px;}
.hname{font-size:14px;font-weight:600;}
.htime{font-size:11px;color:var(--dim);}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:16px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span style="font-size:26px">🍎</span><span class="logo-text">NextApple</span></div>
  <div class="sub">Колесо удачи</div>
</div>

<div class="section">
  <div class="slabel">Попытки клиента</div>
  <div class="abox">
    <div class="anum" id="anum">0</div>
    <div class="abtns">
      <button class="abtn" onclick="add(1)">Покупка от 10 000 ₽ <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(1)">Комплект аксессуаров <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(2)">Гарантия 2 года <span class="badge">+2</span></button>
      <button class="abtn" onclick="add(1)">Отзыв в 2ГИС <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(2)">Сторис в Instagram <span class="badge">+2</span></button>
    </div>
  </div>
</div>

<div class="wheel-wrap">
  <div class="ptr"></div>
  <canvas id="wheel" width="300" height="300"></canvas>
</div>

<button class="spin-btn" id="spinBtn" onclick="spin()">🎰 КРУТИТЬ</button>

<div class="section">
  <div class="slabel">История сегодня</div>
  <div class="hlist" id="hlist"><div class="empty">Пока никто не крутил 🎯</div></div>
</div>

<div class="overlay" id="overlay">
  <div class="cwrap" id="cwrap"></div>
  <div class="rcard">
    <span class="remoji" id="remoji"></span>
    <div class="rtitle" id="rtitle"></div>
    <div class="rdesc" id="rdesc"></div>
    <button class="rbtn" onclick="closeR()">Отлично! ✓</button>
  </div>
</div>

<script>
const P=[
  {name:'iPad 11',emoji:'📱',desc:'iPad 11 Wi-Fi 128GB! Оформите выдачу у менеджера.',type:'jackpot',color:'#FFD700',w:1},
  {name:'Скидка 2 000 ₽',emoji:'🎁',desc:'Скидка 2 000 ₽ на следующую покупку. Действует 30 дней.',type:'win',color:'#7c5cfc',w:6},
  {name:'Защитное стекло',emoji:'🛡️',desc:'Защитное стекло в подарок! Выберите у менеджера.',type:'prize',color:'#52e5a0',w:25},
  {name:'Скидка 1 000 ₽',emoji:'💳',desc:'Скидка 1 000 ₽ на следующую покупку. Действует 30 дней.',type:'win',color:'#5cf0fc',w:12},
  {name:'Чехол',emoji:'📦',desc:'Чехол для вашего устройства в подарок!',type:'prize',color:'#fc5c7d',w:22},
  {name:'Ещё раз!',emoji:'🔄',desc:'Попробуйте снова — удача рядом!',type:'retry',color:'#ff9f43',w:16},
  {name:'Защитное стекло',emoji:'🛡️',desc:'Защитное стекло в подарок!',type:'prize',color:'#52e5a0',w:25},
  {name:'Чехол',emoji:'📦',desc:'Чехол в подарок! Выберите у менеджера.',type:'prize',color:'#fc5c7d',w:22},
];
const N=P.length,SL=(2*Math.PI)/N;
const cv=document.getElementById('wheel'),cx=cv.getContext('2d');
let ang=0,att=0,spin_=false;
const WA=[];P.forEach((p,i)=>{for(let w=0;w<p.w;w++)WA.push(i);});

function draw(r){
  cx.clearRect(0,0,300,300);
  for(let i=0;i<N;i++){
    const s=r+i*SL-Math.PI/2,e=s+SL;
    cx.beginPath();cx.moveTo(150,150);cx.arc(150,150,145,s,e);cx.closePath();
    cx.fillStyle=P[i].color;cx.fill();
    cx.strokeStyle='rgba(0,0,0,.2)';cx.lineWidth=2;cx.stroke();
    cx.save();cx.translate(150,150);cx.rotate(s+SL/2);cx.textAlign='right';
    cx.fillStyle='rgba(0,0,0,.7)';cx.font='bold 11px Inter,sans-serif';
    const nm=P[i].name.length>13?P[i].name.slice(0,12)+'…':P[i].name;
    cx.fillText(nm,133,4);
    cx.font='14px serif';cx.fillText(P[i].emoji,133-cx.measureText(nm).width-3,5);
    cx.restore();
  }
  cx.beginPath();cx.arc(150,150,145,0,2*Math.PI);
  cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=3;cx.stroke();
  cx.beginPath();cx.arc(150,150,18,0,2*Math.PI);
  cx.fillStyle='#0a0a0f';cx.fill();
  cx.strokeStyle='#2a2a3a';cx.lineWidth=2;cx.stroke();
}
draw(0);

function spin(){
  if(spin_||att<=0)return;
  att--;upd();spin_=true;
  document.getElementById('spinBtn').disabled=true;
  const idx=WA[Math.floor(Math.random()*WA.length)];
  const spins=(6+Math.floor(Math.random()*4))*2*Math.PI;
  const tc=idx*SL+SL/2;
  const total=spins-(ang%(2*Math.PI))-tc+2*Math.PI*3;
  const dur=4500,t0=performance.now(),a0=ang;
  function ease(t){return 1-Math.pow(1-t,4);}
  function fr(now){
    const t=Math.min((now-t0)/dur,1);
    ang=a0+total*ease(t);draw(ang);
    if(t<1){requestAnimationFrame(fr);}
    else{spin_=false;document.getElementById('spinBtn').disabled=false;setTimeout(()=>showR(idx),200);}
  }
  requestAnimationFrame(fr);
}

function showR(i){
  const p=P[i];
  document.getElementById('remoji').textContent=p.emoji;
  const t=document.getElementById('rtitle');
  t.textContent=p.type==='jackpot'?'🏆 ДЖЕКПОТ!':p.type==='win'?'Вы выиграли!':p.type==='retry'?'Попробуйте ещё!':p.name;
  t.className='rtitle '+(p.type==='jackpot'?'jackpot':p.type==='win'?'win':'');
  document.getElementById('rdesc').textContent=p.desc;
  document.getElementById('overlay').classList.add('show');
  if(p.type==='jackpot'||p.type==='win')conf(p.type==='jackpot'?100:50);
  if(p.type==='retry'){att++;upd();}else addH(p);
}

function closeR(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cwrap').innerHTML='';
}

function conf(n){
  const w=document.getElementById('cwrap');
  const cl=['#FFD700','#7c5cfc','#fc5c7d','#5cf0fc','#52e5a0','#fff'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='cp';
    const sz=6+Math.random()*8;
    d.style.cssText=`left:${Math.random()*100}vw;background:${cl[Math.floor(Math.random()*cl.length)]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;
    w.appendChild(d);
  }
}

function add(n){
  att+=n;upd();
  const el=document.getElementById('anum');
  el.style.color='#52e5a0';el.style.transform='scale(1.25)';
  setTimeout(()=>{el.style.color='var(--accent)';el.style.transform='';},350);
}

function upd(){
  document.getElementById('anum').textContent=att;
  document.getElementById('spinBtn').disabled=(att<=0||spin_);
}

function addH(p){
  const l=document.getElementById('hlist');
  const e=l.querySelector('.empty');if(e)e.remove();
  const now=new Date();
  const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const d=document.createElement('div');d.className='hitem';
  d.innerHTML=`<span class="hemoji">${p.emoji}</span><div><div class="hname">${p.name}</div><div class="htime">${t}</div></div>`;
  l.insertBefore(d,l.firstChild);
}
</script>
</body>
</html>
