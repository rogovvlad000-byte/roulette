<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NextApple — Открыть подарок</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#0d0d0d;--card:#1a1a1a;--border:#2a2a2a;--accent:#7c5cfc;--gold:#ffd700;--text:#fff;--dim:#666;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;padding-bottom:40px;}
.header{width:100%;padding:20px 16px 12px;text-align:center;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;}
.logo-text{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;}
.sub{font-size:12px;color:var(--dim);}
.section{width:100%;max-width:420px;padding:0 16px;margin-bottom:14px;}
.slabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center;}
.abox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;}
.anum{font-family:'Unbounded',sans-serif;font-size:38px;font-weight:900;color:var(--accent);min-width:52px;text-align:center;transition:color .3s,transform .2s;}
.abtns{display:flex;flex-direction:column;gap:5px;flex:1;}
.abtn{background:rgba(124,92,252,.08);border:1px solid rgba(124,92,252,.2);border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:'Inter',sans-serif;-webkit-appearance:none;width:100%;}
.abtn:active{background:rgba(124,92,252,.25);}
.badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.case-wrapper{width:100%;max-width:420px;padding:0 16px;margin-bottom:20px;}
.case-track-outer{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#111;border:1px solid #333;}
.case-track-outer::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);transform:translateX(-50%);z-index:10;box-shadow:0 0 14px rgba(255,215,0,.9);}
.case-track-outer::after{content:'▼';position:absolute;left:50%;top:-1px;transform:translateX(-50%);color:var(--gold);font-size:16px;z-index:11;filter:drop-shadow(0 0 6px rgba(255,215,0,.9));}
.fade-l,.fade-r{position:absolute;top:0;bottom:0;width:70px;z-index:5;pointer-events:none;}
.fade-l{left:0;background:linear-gradient(to right,#111,transparent);}
.fade-r{right:0;background:linear-gradient(to left,#111,transparent);}
.case-track{display:flex;width:max-content;padding:10px 0;will-change:transform;}
.case-item{width:110px;height:120px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 3px;border-radius:10px;border:2px solid transparent;background:#1e1e1e;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.case-item::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 60%);}
.case-item .ci-emoji{font-size:38px;margin-bottom:5px;line-height:1;}
.case-item .ci-name{font-size:10px;font-weight:700;text-align:center;padding:0 5px;line-height:1.3;color:#ddd;}
.case-item .ci-bar{position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 8px 8px;}
.case-item.ipad-glow{border-color:#FFD700 !important;box-shadow:0 0 18px rgba(255,215,0,.5) !important;}
.spin-btn{display:block;width:220px;margin:0 auto 20px;padding:15px;background:linear-gradient(135deg,#7c5cfc,#fc5c7d);border:none;border-radius:50px;color:#fff;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 24px rgba(124,92,252,.5);-webkit-appearance:none;transition:transform .1s,opacity .15s;}
.spin-btn:active{transform:scale(.95);}
.spin-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.prizes-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.pi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;}
.pi.full{grid-column:1/-1;border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.04);}
.pi-emoji{font-size:22px;}
.pi-name{font-size:12px;font-weight:700;}
.pi-rare{font-size:10px;color:var(--dim);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.overlay.show{display:flex;}
.rcard{background:#1a1a1a;border:1px solid #333;border-radius:24px;padding:36px 28px;max-width:300px;width:88%;text-align:center;animation:pop .45s cubic-bezier(.34,1.56,.64,1);z-index:201;position:relative;overflow:hidden;}
.rcard::before{content:'';position:absolute;inset:0;opacity:.06;background:var(--rcolor,#fff);pointer-events:none;}
@keyframes pop{from{transform:scale(.5) translateY(40px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.r-glow{position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;opacity:.15;filter:blur(40px);pointer-events:none;}
.remoji{font-size:70px;display:block;margin-bottom:12px;position:relative;z-index:1;}
.rtitle{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:900;margin-bottom:6px;position:relative;z-index:1;}
.rtitle.jackpot{color:var(--gold);}
.rtitle.win{color:#a78bfa;}
.rdesc{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6;position:relative;z-index:1;white-space:pre-line;}
.rbtn{width:100%;padding:14px;background:linear-gradient(135deg,#7c5cfc,#fc5c7d);border:none;border-radius:14px;color:#fff;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;position:relative;z-index:1;}
.rbtn:active{opacity:.85;}
.cwrap{position:fixed;inset:0;pointer-events:none;z-index:199;overflow:hidden;}
.cp{position:absolute;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
.hlist{display:flex;flex-direction:column;gap:8px;}
.hitem{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;}
.hemoji{font-size:22px;}
.hname{font-size:14px;font-weight:600;}
.htime{font-size:11px;color:var(--dim);}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:16px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span style="font-size:26px">🍎</span><span class="logo-text">NextApple</span></div>
  <div class="sub">Открой подарок</div>
</div>

<div class="section">
  <div class="slabel">Попытки клиента</div>
  <div class="abox">
    <div class="anum" id="anum">0</div>
    <div class="abtns">
      <button class="abtn" data-add="1">Покупка от 10 000 ₽ <span class="badge">+1</span></button>
      <button class="abtn" data-add="1">Комплект аксессуаров <span class="badge">+1</span></button>
      <button class="abtn" data-add="2">Гарантия 2 года <span class="badge">+2</span></button>
      <button class="abtn" data-add="1">Отзыв в 2ГИС <span class="badge">+1</span></button>
      <button class="abtn" data-add="2">Сторис в Instagram <span class="badge">+2</span></button>
      <button class="abtn" data-add="1">Регистрация в UDS <span class="badge">+1</span></button>
    </div>
  </div>
</div>

<div class="case-wrapper">
  <div class="slabel" style="margin-bottom:10px;">Прокрути и получи подарок</div>
  <div class="case-track-outer" id="trackOuter">
    <div class="fade-l"></div>
    <div class="fade-r"></div>
    <div class="case-track" id="track"></div>
  </div>
</div>

<button class="spin-btn" id="spinBtn">🎁 ОТКРЫТЬ</button>

<div class="section">
  <div class="slabel">Призы</div>
  <div class="prizes-grid">
    <div class="pi full"><span class="pi-emoji">📱</span><div><div class="pi-name">iPad 11</div><div class="pi-rare">Джекпот</div></div></div>
    <div class="pi"><span class="pi-emoji">💳</span><div><div class="pi-name">Скидка 1 000 ₽</div><div class="pi-rare">Необычный</div></div></div>
    <div class="pi"><span class="pi-emoji">📦</span><div><div class="pi-name">Чехол</div><div class="pi-rare">Обычный</div></div></div>
    <div class="pi"><span class="pi-emoji">🔄</span><div><div class="pi-name">Ещё раз</div><div class="pi-rare">Обычный</div></div></div>
    <div class="pi"><span class="pi-emoji">🛡️</span><div><div class="pi-name">Стекло</div><div class="pi-rare">Необычный</div></div></div>
    <div class="pi"><span class="pi-emoji">🎁</span><div><div class="pi-name">Скидка 2 000 ₽</div><div class="pi-rare">Редкий</div></div></div>
  </div>
</div>

<div class="section">
  <div class="slabel">История сегодня</div>
  <div class="hlist" id="hlist"><div class="empty">Пока никто не открывал 🎯</div></div>
</div>

<div class="overlay" id="overlay">
  <div class="cwrap" id="cwrap"></div>
  <div class="rcard" id="rcard">
    <div class="r-glow" id="rglow"></div>
    <span class="remoji" id="remoji"></span>
    <div class="rtitle" id="rtitle"></div>
    <div class="rdesc" id="rdesc"></div>
    <button class="rbtn" id="closeBtn">Отлично! ✓</button>
  </div>
</div>

<script>
var PRIZES = [
  {name:'iPad 11',      emoji:'📱', desc:'iPad 11 Wi-Fi 128GB!\nОформите выдачу у менеджера.',    type:'jackpot', color:'#FFD700', rare:'Джекпот',   w:1},
  {name:'Скидка 2000₽', emoji:'🎁', desc:'Скидка 2 000 ₽ на след. покупку.\nДействует 30 дней.', type:'win',     color:'#a78bfa', rare:'Редкий',    w:28},
  {name:'Стекло',       emoji:'🛡️', desc:'Защитное стекло в подарок!\nВыберите у менеджера.',     type:'prize',   color:'#52e5a0', rare:'Необычный', w:50},
  {name:'Скидка 1000₽', emoji:'💳', desc:'Скидка 1 000 ₽ на след. покупку.\nДействует 30 дней.', type:'win',     color:'#5cf0fc', rare:'Необычный', w:180},
  {name:'Чехол',        emoji:'📦', desc:'Чехол в подарок!\nВыберите у менеджера.',               type:'prize',   color:'#fc5c7d', rare:'Обычный',   w:175},
  {name:'Ещё раз!',     emoji:'🔄', desc:'Попробуйте снова —\nудача совсем рядом!',               type:'retry',   color:'#ff9f43', rare:'Обычный',   w:65},
];
// Итого: 1+28+50+180+175+65 = 499 единиц
// iPad: 1/499 ≈ 0.2% ✓

var WA = [];
for (var i = 0; i < PRIZES.length; i++)
  for (var w = 0; w < PRIZES[i].w; w++) WA.push(i);

// Паттерн near-miss: раз в 3, потом в 5, потом в 2, потом в 4 — циклично
var NEAR_MISS_PATTERN = [3, 5, 2, 4];
var nearMissPatternIdx = 0;
var nextNearMissAt = NEAR_MISS_PATTERN[0]; // первый near-miss на 3-й попытке

var IW = 116;
var spinning = false, att = 0, spinCount = 0;
var track = document.getElementById('track');
var trackOuter = document.getElementById('trackOuter');

function makeItem(p, isIpad) {
  var el = document.createElement('div');
  el.className = 'case-item' + (isIpad ? ' ipad-glow' : '');
  el.style.borderColor = p.color + (isIpad ? 'cc' : '44');
  el.innerHTML =
    '<div class="ci-emoji">' + p.emoji + '</div>' +
    '<div class="ci-name">' + p.name + '</div>' +
    '<div class="ci-bar" style="background:' + p.color + '"></div>';
  return el;
}

// Строим ленту с частыми iPad
function buildStrip(finalPos, nearMissPos) {
  track.innerHTML = '';
  var TOTAL = 80;

  // Заполняем случайными призами, iPad встречается часто (~каждые 5-7 позиций)
  for (var i = 0; i < TOTAL; i++) {
    // Каждые 5-7 позиций принудительно ставим iPad для визуала
    var forceIpad = (i > 5 && i < finalPos - 3 && i !== nearMissPos && (i % 6 === 0 || i % 7 === 0));
    var ri = forceIpad ? 0 : WA[Math.floor(Math.random() * WA.length)];
    track.appendChild(makeItem(PRIZES[ri], ri === 0));
  }

  // Near miss: iPad прямо перед финалом
  if (nearMissPos !== null) {
    setItem(nearMissPos, 0, true);
  }
  // Финальный приз устанавливается отдельно через setFinal()
}

function setItem(pos, prizeIdx, isIpad) {
  var p = PRIZES[prizeIdx];
  var el = track.children[pos];
  if (!el) return;
  el.className = 'case-item' + (isIpad ? ' ipad-glow' : '');
  el.style.borderColor = p.color + (isIpad ? 'cc' : '55');
  el.innerHTML =
    '<div class="ci-emoji">'+p.emoji+'</div>'+
    '<div class="ci-name">'+p.name+'</div>'+
    '<div class="ci-bar" style="background:'+p.color+'"></div>';
}

// Отдельная функция для установки финального приза по индексу
function setFinal(pos, finalIdx) {
  var p = PRIZES[finalIdx];
  var el = track.children[pos];
  if (!el) return;
  el.className = 'case-item';
  el.style.borderColor = p.color + '55';
  el.innerHTML =
    '<div class="ci-emoji">'+p.emoji+'</div>'+
    '<div class="ci-name">'+p.name+'</div>'+
    '<div class="ci-bar" style="background:'+p.color+'"></div>';
}

var FINAL_POS = 60;      // обычный финал
var NEAR_MISS_FINAL = 58; // при near-miss финал здесь
var NEAR_MISS_POS = 59;   // iPad прямо ПОСЛЕ финала при near-miss

function doSpin() {
  if (spinning || att <= 0) return;
  att--; upd(); spinning = true;
  document.getElementById('spinBtn').disabled = true;
  spinCount++;

  var nearMiss = (spinCount === nextNearMissAt);
  var finalIdx = WA[Math.floor(Math.random() * WA.length)];
  if (nearMiss) {
    if (finalIdx === 0) finalIdx = 4;
    nearMissPatternIdx = (nearMissPatternIdx + 1) % NEAR_MISS_PATTERN.length;
    nextNearMissAt = spinCount + NEAR_MISS_PATTERN[nearMissPatternIdx];
  }

  var usedFinalPos = nearMiss ? NEAR_MISS_FINAL : FINAL_POS;

  buildStrip(usedFinalPos, nearMiss ? NEAR_MISS_POS : null);
  setFinal(usedFinalPos, finalIdx);

  track.style.transition = 'none';
  track.style.transform = 'translateX(0px)';
  track.getBoundingClientRect();

  var outerW = trackOuter.offsetWidth;
  var center = outerW / 2;

  if (nearMiss) {
    animateNearMiss(usedFinalPos, finalIdx, center);
  } else {
    // 5 равных позиций внутри элемента: начало, чуть дальше, середина, дальше середины, почти конец
    var stops = [-IW * 0.4, -IW * 0.2, 0, IW * 0.2, IW * 0.4];
    var jitter = stops[Math.floor(Math.random() * stops.length)];
    var targetOffset = -(FINAL_POS * IW + IW / 2 - center + jitter);
    animateNormal(targetOffset, finalIdx);
  }
}

function animateNormal(target, finalIdx) {
  // Останавливаемся чуть не по центру — как в CS:GO
  // target уже содержит jitter из doSpin
  var dur = 6200;
  var t0 = null;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  (function frame(now) {
    if (!t0) t0 = now;
    var t = Math.min((now - t0) / dur, 1);
    track.style.transform = 'translateX(' + (target * ease(t)) + 'px)';
    if (t < 1) requestAnimationFrame(frame);
    else onDone(FINAL_POS, finalIdx);
  })(performance.now());
}

function animateNearMiss(finalPos, finalIdx, center) {
  // Финал на позиции 58, iPad на 59.
  // Лента останавливается так что финал под линией, iPad виден правее.
  // Одна непрерывная кривая — никаких фаз, никакого рывка.
  // Скорость в конце очень низкая — выглядит как обычное торможение.

  // 5 равных позиций внутри финального элемента
  var stops = [-IW * 0.4, -IW * 0.2, 0, IW * 0.2, IW * 0.4];
  var jitter = stops[Math.floor(Math.random() * stops.length)];
  var target = -(finalPos * IW + IW / 2 - center + jitter);

  var dur = 6500;
  var t0 = null;

  // Сильное ease-out — лента долго тормозит, iPad проплывает мимо медленно
  function ease(t) { return 1 - Math.pow(1 - t, 5); }

  (function frame(now) {
    if (!t0) t0 = now;
    var t = Math.min((now - t0) / dur, 1);
    track.style.transform = 'translateX(' + (target * ease(t)) + 'px)';
    if (t < 1) requestAnimationFrame(frame);
    else onDone(finalPos, finalIdx);
  })(performance.now());
}

function onDone(finalPos, finalIdx) {
  if (finalPos === undefined) { finalPos = FINAL_POS; }
  var el = track.children[finalPos];
  if (el) {
    el.style.borderColor = '#fff';
    el.style.boxShadow = '0 0 20px rgba(255,255,255,.4)';
  }
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  setTimeout(function(){ showResult(finalIdx); }, 500);
}

function showResult(i) {
  var p = PRIZES[i];
  document.getElementById('rcard').style.setProperty('--rcolor', p.color);
  document.getElementById('rglow').style.background = p.color;
  document.getElementById('remoji').textContent = p.emoji;
  var tEl = document.getElementById('rtitle');
  if (p.type==='jackpot'){tEl.textContent='🏆 ДЖЕКПОТ!';tEl.className='rtitle jackpot';}
  else if (p.type==='win'){tEl.textContent='Вы выиграли!';tEl.className='rtitle win';}
  else if (p.type==='retry'){tEl.textContent='Попробуйте ещё!';tEl.className='rtitle';}
  else{tEl.textContent=p.name;tEl.className='rtitle';}
  document.getElementById('rdesc').textContent = p.desc;
  document.getElementById('overlay').classList.add('show');
  if (p.type==='jackpot'||p.type==='win') launchConfetti(p.type==='jackpot'?120:60);
  if (p.type==='retry'){att++;upd();}else addHistory(p);
}

function closeResult() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cwrap').innerHTML='';
}

function launchConfetti(n) {
  var wrap = document.getElementById('cwrap');
  var colors=['#FFD700','#7c5cfc','#fc5c7d','#5cf0fc','#52e5a0','#fff'];
  for (var i=0;i<n;i++){
    var d=document.createElement('div');d.className='cp';
    var sz=(6+Math.random()*10)+'px';
    d.style.left=(Math.random()*100)+'vw';d.style.top='-10px';
    d.style.width=sz;d.style.height=sz;
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    d.style.animationDuration=(1.5+Math.random()*2.5)+'s';
    d.style.animationDelay=(Math.random()*.5)+'s';
    wrap.appendChild(d);
  }
}

function add(n) {
  att+=n;upd();
  var el=document.getElementById('anum');
  el.style.color='#52e5a0';el.style.transform='scale(1.3)';
  setTimeout(function(){el.style.color='var(--accent)';el.style.transform='';},350);
}

function upd() {
  document.getElementById('anum').textContent=att;
  document.getElementById('spinBtn').disabled=(att<=0||spinning);
}

function addHistory(p) {
  var list=document.getElementById('hlist');
  var empty=list.querySelector('.empty');if(empty)empty.remove();
  var now=new Date();
  var t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var item=document.createElement('div');item.className='hitem';
  item.innerHTML='<span class="hemoji">'+p.emoji+'</span><div><div class="hname">'+p.name+'</div><div class="htime">'+t+'</div></div>';
  list.insertBefore(item,list.firstChild);
}

buildStrip(FINAL_POS, null);
setFinal(FINAL_POS, 4);
track.style.transform='translateX(0px)';

document.getElementById('spinBtn').addEventListener('touchstart',function(e){e.preventDefault();doSpin();},{passive:false});
document.getElementById('spinBtn').addEventListener('click',function(){doSpin();});
document.getElementById('closeBtn').addEventListener('touchstart',function(e){e.preventDefault();closeResult();},{passive:false});
document.getElementById('closeBtn').addEventListener('click',function(){closeResult();});
document.querySelectorAll('.abtn').forEach(function(btn){
  btn.addEventListener('touchstart',function(e){e.preventDefault();add(parseInt(this.getAttribute('data-add')));},{passive:false});
  btn.addEventListener('click',function(){add(parseInt(this.getAttribute('data-add')));});
});
</script>
</body>
</html>
