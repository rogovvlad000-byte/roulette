<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NextApple — Колесо Удачи</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
  :root {
    --bg: #0a0a0f;
    --card: #13131a;
    --border: #2a2a3a;
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --gold: #ffd700;
    --text: #ffffff;
    --text-dim: #888899;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 40px;
  }
  .header {
    width: 100%;
    padding: 24px 20px 12px;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .logo-text {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 900;
  }
  .subtitle { font-size: 13px; color: var(--text-dim); }

  /* Attempts */
  .attempts-section {
    width: 100%;
    max-width: 380px;
    padding: 0 16px;
    margin-bottom: 16px;
  }
  .section-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
  }
  .attempts-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .attempts-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 40px;
    font-weight: 900;
    color: var(--accent);
    min-width: 56px;
    text-align: center;
    transition: color 0.3s, transform 0.2s;
  }
  .attempts-btns { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .abtn {
    background: rgba(124,92,252,0.1);
    border: 1px solid rgba(124,92,252,0.25);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 11px;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
    -webkit-appearance: none;
  }
  .abtn:active { background: rgba(124,92,252,0.25); }
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }

  /* Wheel area */
  .wheel-area {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto 16px;
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 24px solid var(--gold);
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.7));
    z-index: 10;
  }
  #wheel {
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(124,92,252,0.35);
    display: block;
  }

  /* Spin button — BELOW wheel, not on top of canvas */
  .spin-btn {
    display: block;
    width: 200px;
    margin: 0 auto 20px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 50px;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(124,92,252,0.4);
    transition: transform 0.1s, opacity 0.2s;
    -webkit-appearance: none;
  }
  .spin-btn:active { transform: scale(0.95); }
  .spin-btn:disabled { opacity: 0.35; transform: none; cursor: not-allowed; }

  /* Result overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 300px;
    width: 88%;
    text-align: center;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    z-index: 201;
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .res-emoji { font-size: 60px; display: block; margin-bottom: 12px; }
  .res-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .res-title.jackpot { color: var(--gold); }
  .res-title.win { color: var(--accent); }
  .res-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; }
  .res-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .res-btn:active { opacity: 0.85; }

  /* Confetti */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 199; overflow: hidden; }
  .cp {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
  }

  /* History */
  .history-section {
    width: 100%;
    max-width: 380px;
    padding: 0 16px;
  }
  .hlist { display: flex; flex-direction: column; gap: 8px; }
  .hitem {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hemoji { font-size: 22px; }
  .hname { font-size: 14px; font-weight: 600; }
  .htime { font-size: 11px; color: var(--text-dim); }
  .empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span style="font-size:28px">🍎</span>
    <span class="logo-text">NextApple</span>
  </div>
  <div class="subtitle">Колесо удачи</div>
</div>

<div class="attempts-section">
  <div class="section-label">Попытки клиента</div>
  <div class="attempts-box">
    <div class="attempts-num" id="attNum">0</div>
    <div class="attempts-btns">
      <button class="abtn" onclick="add(1,'Покупка от 10 000 ₽')">Покупка от 10 000 ₽ <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(1,'Комплект аксессуаров')">Комплект аксессуаров <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(2,'Гарантия 2 года')">Гарантия 2 года <span class="badge">+2</span></button>
      <button class="abtn" onclick="add(1,'Отзыв в 2ГИС')">Отзыв в 2ГИС <span class="badge">+1</span></button>
      <button class="abtn" onclick="add(2,'Сторис в Instagram')">Сторис в Instagram <span class="badge">+2</span></button>
    </div>
  </div>
</div>

<div class="wheel-area">
  <div class="pointer"></div>
  <canvas id="wheel" width="300" height="300"></canvas>
</div>

<button class="spin-btn" id="spinBtn" onclick="spin()">🎰 КРУТИТЬ</button>

<div class="history-section">
  <div class="section-label">История сегодня</div>
  <div class="hlist" id="hlist"><div class="empty">Пока никто не крутил 🎯</div></div>
</div>

<!-- Result overlay -->
<div class="overlay" id="overlay">
  <div class="confetti-wrap" id="confWrap"></div>
  <div class="result-card">
    <span class="res-emoji" id="resEmoji"></span>
    <div class="res-title" id="resTitle"></div>
    <div class="res-desc" id="resDesc"></div>
    <button class="res-btn" onclick="closeResult()">Отлично! ✓</button>
  </div>
</div>

<script>
const PRIZES = [
  { name:'iPad 11',         emoji:'📱', desc:'iPad 11 Wi-Fi 128GB! Оформите выдачу у менеджера.',               type:'jackpot',     color:'#FFD700', weight:1  },
  { name:'Скидка 2 000 ₽', emoji:'🎁', desc:'Скидка 2 000 ₽ на следующую покупку. Действует 30 дней.',          type:'win',         color:'#7c5cfc', weight:6  },
  { name:'Защитное стекло', emoji:'🛡️', desc:'Защитное стекло в подарок! Выберите у менеджера.',                type:'consolation', color:'#52e5a0', weight:28 },
  { name:'Скидка 1 000 ₽', emoji:'💳', desc:'Скидка 1 000 ₽ на следующую покупку. Действует 30 дней.',          type:'win',         color:'#5cf0fc', weight:12 },
  { name:'Чехол',           emoji:'📦', desc:'Чехол для вашего устройства в подарок! Выберите у менеджера.',    type:'consolation', color:'#fc5c7d', weight:22 },
  { name:'Ещё раз!',        emoji:'🔄', desc:'Попробуйте снова — удача рядом!',                                  type:'retry',       color:'#ff9f43', weight:18 },
  { name:'Защитное стекло', emoji:'🛡️', desc:'Защитное стекло в подарок!',                                       type:'consolation', color:'#52e5a0', weight:28 },
  { name:'Чехол',           emoji:'📦', desc:'Чехол в подарок!',                                                 type:'consolation', color:'#fc5c7d', weight:22 },
];

const N = PRIZES.length;
const SLICE = (2 * Math.PI) / N;
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let angle = 0;
let attempts = 0;
let spinning = false;

// Build weighted index array
const weighted = [];
PRIZES.forEach((p, i) => { for (let w = 0; w < p.weight; w++) weighted.push(i); });

function drawWheel(rot) {
  const cx = 150, cy = 150, r = 145;
  ctx.clearRect(0, 0, 300, 300);
  for (let i = 0; i < N; i++) {
    const s = rot + i * SLICE - Math.PI / 2;
    const e = s + SLICE;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, s, e);
    ctx.closePath();
    ctx.fillStyle = PRIZES[i].color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s + SLICE / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.font = 'bold 11px Inter,sans-serif';
    const nm = PRIZES[i].name.length > 13 ? PRIZES[i].name.slice(0,12)+'…' : PRIZES[i].name;
    ctx.fillText(nm, r - 10, 4);
    ctx.font = '14px serif';
    ctx.fillText(PRIZES[i].emoji, r - 10 - ctx.measureText(nm).width - 4, 5);
    ctx.restore();
  }
  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Center
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0a0f';
  ctx.fill();
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 2;
  ctx.stroke();
}

drawWheel(0);

function spin() {
  if (spinning || attempts <= 0) return;
  attempts--;
  updateNum();
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const prizeIdx = weighted[Math.floor(Math.random() * weighted.length)];
  // Target: prizeIdx slice center under pointer (top = -PI/2)
  // We need: angle + prizeIdx*SLICE + SLICE/2 ≡ 0 (mod 2PI) after rotation
  // finalAngle = -(prizeIdx*SLICE + SLICE/2) + fullSpins
  const spins = (6 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  const targetCenter = prizeIdx * SLICE + SLICE / 2;
  const totalRotation = spins - (angle % (2 * Math.PI)) - targetCenter;
  const finalAngle = angle + totalRotation + (2 * Math.PI * 3); // ensure positive

  const duration = 4500;
  const start = performance.now();
  const startAngle = angle;
  const delta = finalAngle - startAngle;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    angle = startAngle + delta * ease(t);
    drawWheel(angle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      angle = finalAngle;
      drawWheel(angle);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      setTimeout(() => showResult(prizeIdx), 200);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(idx) {
  const p = PRIZES[idx];
  document.getElementById('resEmoji').textContent = p.emoji;
  const titleEl = document.getElementById('resTitle');
  titleEl.textContent = p.type === 'jackpot' ? '🏆 ДЖЕКПОТ!' : p.type === 'win' ? 'Вы выиграли!' : p.type === 'retry' ? 'Попробуйте ещё!' : p.name;
  titleEl.className = 'res-title ' + (p.type === 'jackpot' ? 'jackpot' : p.type === 'win' ? 'win' : '');
  document.getElementById('resDesc').textContent = p.desc;
  document.getElementById('overlay').classList.add('show');
  if (p.type === 'jackpot' || p.type === 'win') confetti(p.type === 'jackpot' ? 100 : 50);
  if (p.type === 'retry') { attempts++; updateNum(); }
  else addHistory(p);
}

function closeResult() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('confWrap').innerHTML = '';
}

function confetti(n) {
  const wrap = document.getElementById('confWrap');
  const colors = ['#FFD700','#7c5cfc','#fc5c7d','#5cf0fc','#52e5a0','#fff'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'cp';
    d.style.cssText = `left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.4}s`;
    wrap.appendChild(d);
  }
}

function add(n, reason) {
  attempts += n;
  updateNum();
  const el = document.getElementById('attNum');
  el.style.color = '#52e5a0';
  el.style.transform = 'scale(1.25)';
  setTimeout(() => { el.style.color = 'var(--accent)'; el.style.transform = ''; }, 350);
}

function updateNum() {
  document.getElementById('attNum').textContent = attempts;
  document.getElementById('spinBtn').disabled = (attempts <= 0 || spinning);
}

function addHistory(p) {
  const list = document.getElementById('hlist');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();
  const now = new Date();
  const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const item = document.createElement('div');
  item.className = 'hitem';
  item.innerHTML = `<span class="hemoji">${p.emoji}</span><div><div class="hname">${p.name}</div><div class="htime">${t}</div></div>`;
  list.insertBefore(item, list.firstChild);
}
</script>
</body>
</html>
